sentence=High-performance embedded Relational Database Management System (DBMS) for SD cards.
paragraph=MicroDB provides an ultra-fast binary relational database engine for Arduino and ESP32 over SD cards. Features O(1) random-access CRUD, free-list tombstone space recycling, secondary indexing (FNV-1a / B+Tree concept), memory-efficient streaming cursors (O(1) RAM usage), and relational INNER JOIN capabilities without heap overhead.
